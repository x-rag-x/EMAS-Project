<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EAMS – Sign In | Sri Shakthi</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <div class="lc">
    <div class="ll">
      <img src="assets/logo.png" alt="Logo" height=60 class="center-img">
      <span class="lb">Sri Shakthi Institute</span>
    </div>
    <div class="lh">EAMS Login</div>

    <!-- ROLE SELECTOR — tabs hidden dynamically if blocked by maintenance -->
    <div class="rtabs" style="gap:8px;" id="rtabs-wrap">
      <div class="rtab" id="tab-student" onclick="pickRole('student')" style="padding:8px 18px;">
        Student
      </div>
      <div class="rtab" id="tab-teacher" onclick="pickRole('teacher')" style="padding:8px 18px;">
        Teacher
      </div>
      <div class="rtab sel" id="tab-admin" onclick="pickRole('admin')" style="padding:8px 18px;">
        Admin
      </div>
    </div>

    <!-- Shown when some roles are blocked by maintenance -->
    <div id="maint-notice"
      style="display:none;background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.35);border-radius:10px;padding:10px 14px;font-size:12px;color:#92400e;margin-bottom:14px;position:relative;z-index:1;line-height:1.5;">
      🔧 <b>Maintenance in progress</b> — some logins are restricted. Only available roles are shown above.
    </div>

    <div class="le" id="lerr">Invalid credentials. Please try again.</div>

    <div class="lf2"><label>Username</label><input type="text" id="lu" placeholder="Enter username"
        autocomplete="username"></div>
    <div class="lf2"><label>Password</label>
      <div class="pw-wrap"><input type="password" id="lp" placeholder="Enter password"
          autocomplete="current-password"><button type="button" class="pw-eye" onclick="togglePw('lp',this)"
          tabindex="-1" title="Show password">👁</button></div>
    </div>

    <button class="lbn" id="lbn" onclick="doSignIn()"><span id="lbn-txt">Sign In</span></button>
  </div>

  <div id="msg-toast">
    <div id="msg-toast-bar"></div>
    <div id="msg-toast-text"></div>
    <button id="msg-toast-close" onclick="hideMsgToast()">✕</button>
  </div>

  <script src="js/pages/login.page.js"></script>
</body>
</html>
